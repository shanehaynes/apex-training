# XcodeGen spec. The .xcodeproj is generated and git-ignored (D-005) so parallel
# worktrees never conflict on it: run `xcodegen generate` in your own worktree.
name: Apex
options:
  bundleIdPrefix: com.shanehaynes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  # A third configuration, not a scheme argument: pointing at the local stack
  # changes the Info.plist, and Info.plist values are per-configuration.
  Local: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: G44GWSXFK2
    # Project-level, not per target: the app and the ApexWidgets extension must
    # carry the same version and build number or App Store Connect rejects the
    # upload. testflight.sh stamps CURRENT_PROJECT_VERSION on the command line,
    # which reaches every target the same way.
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  ApexCore:
    path: Packages/ApexCore
  ApexKit:
    path: Packages/ApexKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.4

targets:
  Apex:
    type: application
    platform: iOS
    sources:
      - path: Apex
      # The fixture JSON, as a folder reference, so the -apexMockClient seam
      # can answer /api/* in-process. Release excludes it (Release.xcconfig).
      - path: Fixtures
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Local: Config/Local.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shanehaynes.apextraining
        PRODUCT_NAME: Apex
        INFOPLIST_FILE: Apex/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apex/Apex.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only: the design spec is a phone spec (D-009 drops the week view
        # rather than adapt it), so claiming iPad support would be a lie.
        TARGETED_DEVICE_FAMILY: "1"
        # Views are MainActor by default; ApexCore's actors are not (its package
        # deliberately omits this).
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies:
      - package: ApexCore
        product: ApexCore
      - package: ApexKit
        product: ApexAuth
      - package: ApexKit
        product: ApexPersistence
      - package: ApexKit
        product: ApexUI
      - package: ApexKit
        product: ApexFeatures
      - package: ApexKit
        product: ApexActivity
      # The Live Activity extension (W12). An app-extension dependency is
      # embedded into the app bundle by XcodeGen.
      - target: ApexWidgets

  # The widget extension: a thin @main bundle over ApexActivity's views. It
  # links ApexActivity (and through it ApexUI + ApexCore) and nothing else —
  # widget extension processes run under a memory ceiling a fraction of the
  # app's, and supabase-swift or GRDB would be dead weight there.
  ApexWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ApexWidgets
    configFiles:
      Debug: Config/Debug.xcconfig
      Local: Config/Local.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shanehaynes.apextraining.widgets
        PRODUCT_NAME: ApexWidgets
        INFOPLIST_FILE: ApexWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies:
      - package: ApexKit
        product: ApexActivity
      - package: ApexKit
        product: ApexUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  ApexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ApexTests
    # Deliberately not SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor. XCTestCase's
    # init and setUp overrides are nonisolated, so a MainActor default makes
    # every subclass fail to compile. Tests that touch MainActor code annotate
    # the individual test method instead.
    dependencies:
      - target: Apex
      - package: SnapshotTesting
        product: SnapshotTesting
      # Visible to the compiler but not linked again: the host app already links
      # these, and a second copy in the test bundle duplicates every symbol.
      - package: ApexCore
        product: ApexCore
        link: false
      - package: ApexKit
        product: ApexUI
        link: false
      - package: ApexKit
        product: ApexPersistence
        link: false
      - package: ApexKit
        product: ApexFeatures
        link: false
      - package: ApexKit
        product: ApexActivity
        link: false

  ApexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ApexUITests
    dependencies:
      - target: Apex

schemes:
  Apex:
    build:
      targets:
        Apex: all
        ApexTests: [test]
        ApexUITests: [test]
    # The dev loop runs against the local stack; AppConfig.assertSafe() refuses
    # any other configuration on a simulator.
    run:
      config: Local
    test:
      config: Local
      targets:
        - ApexTests
        - ApexUITests
    profile:
      config: Local
    analyze:
      config: Local
    archive:
      config: Release
