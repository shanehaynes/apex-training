# Nightly encrypted dump of the production database, proven by a restore.
#
# Production is Supabase Free, which keeps no backups. This dumps it with the
# Supabase CLI (scripts/db-backup.sh), encrypts the bundle to the public keys in
# scripts/backup/age-recipient.txt (plus a throwaway key minted for the run, so
# the drill can open it), uploads it as an artifact, and THEN restores
# that same bundle into a throwaway `supabase start` on the runner
# (scripts/db-restore-drill.sh: decrypt the .age, diff it against the
# plaintext, restore, check). Upload comes first on purpose: a drill can
# fail for reasons that are not the backup's (the CLI's local auth schema
# lagging production's, production lagging main's migrations), and that must
# turn the run red without costing the night's only backup.
#
# The repo is public: artifacts are downloadable by any logged-in GitHub user
# (hence the encryption) and logs are readable by everyone (hence no URLs, no
# per-table counts). SUPABASE_DB_URL is the session-pooler URL (README,
# "Backups"); it is absent on forks, so the job skips rather than fails there.
name: Backup

on:
  schedule:
    - cron: '30 4 * * *'   # after the 03:30 UTC provider sync, before CI's 10:00 nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      # A job-level `if:` cannot read secrets, so gate in a step. On the
      # canonical repo a missing secret is a FAILURE: three nights of green
      # "skipped" runs once passed for three nights of backups. Only a fork,
      # which cannot have the secret, skips.
      - id: gate
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            if [ "$GITHUB_REPOSITORY" = "shanehaynes/apex-training" ]; then
              echo "::error::SUPABASE_DB_URL secret not set — no backup was taken (README, Backups)."
              exit 1
            fi
            echo "::notice::SUPABASE_DB_URL secret not set — backup skipped on fork."
            echo run=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub masks the whole secret; mask the password on its own too,
          # in case a CLI error reformats the URL.
          pw=${SUPABASE_DB_URL#*://*:}; pw=${pw%%@*}
          [ -n "$pw" ] && echo "::add-mask::$pw"
          echo run=true >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v7      # scripts/db-types.sh --check needs npx
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - name: Install age
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      # The drill decrypts the uploaded bundle (scripts/db-restore-drill.sh),
      # which needs a private key. Rather than park a real backup key in a
      # public repo's Actions secrets — where every workflow run could read it,
      # and where it would undo "the private key lives only with Shane" — mint
      # a throwaway identity here and add it as an EXTRA recipient for this run
      # only. The committed keys stay recipients, so the artifact is still
      # Shane's to open; the throwaway lives in RUNNER_TEMP and dies with the
      # job, and anyone who could read it could already read the plaintext dump
      # sitting beside it. Its public half is not secret, so nothing is masked.
      # What this cannot prove is that the escrowed key opens a bundle — only
      # the by-hand restore does (README, "Backups").
      - name: Mint a throwaway key for the restore drill
        id: drillkey
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          # db-backup.sh checks the recipients file it is handed, and the one
          # handed to it below always has the throwaway in it. So check the
          # committed file here, or an empty age-recipient.txt would encrypt
          # the night's bundle to a key that dies with this runner.
          if ! grep -qE '^age1[0-9a-z]+$' scripts/backup/age-recipient.txt; then
            echo "::error::scripts/backup/age-recipient.txt holds no age1... public key — a bundle only the throwaway drill key can open is not a backup (README, Backups)."
            exit 1
          fi
          key="$RUNNER_TEMP/drill-age.key"
          age-keygen -o "$key" >/dev/null 2>&1
          pub=$(sed -n 's/^# public key: //p' "$key")
          [ -n "$pub" ] || { echo "::error::age-keygen produced no public key"; exit 1; }
          rcpt="$RUNNER_TEMP/age-recipients.txt"
          cat scripts/backup/age-recipient.txt > "$rcpt"
          printf '%s\n' "$pub" >> "$rcpt"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "recipients=$rcpt" >> "$GITHUB_OUTPUT"

      # `latest`, like ci.yml's full job: the newest CLI ships the newest local
      # auth schema, which is what the restored auth rows must fit into.
      - uses: supabase/setup-cli@v3
        if: steps.gate.outputs.run == 'true'
        with:
          version: latest
      - name: Start a throwaway local stack
        if: steps.gate.outputs.run == 'true'
        # Docker Hub rather than ghcr.io — see the same step in ci.yml.
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: supabase start

      - name: Dump and encrypt
        if: steps.gate.outputs.run == 'true'
        env:
          APEX_AGE_RECIPIENTS: ${{ steps.drillkey.outputs.recipients }}
        run: scripts/db-backup.sh backup
      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.run == 'true'
        with:
          name: db-backup-${{ steps.gate.outputs.date }}-${{ github.run_id }}
          path: backup/*.age
          retention-days: 90
          compression-level: 0     # age output is incompressible
          if-no-files-found: error

      # Reads back the same backup/*.age the upload above took: the drill
      # decrypts it, diffs it against the plaintext, and only then restores.
      - name: Restore drill
        if: steps.gate.outputs.run == 'true'
        env:
          APEX_AGE_IDENTITY: ${{ steps.drillkey.outputs.key }}
        run: scripts/db-restore-drill.sh backup
