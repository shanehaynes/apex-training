# Nightly encrypted dump of the production database, proven by a restore.
#
# Production is Supabase Free, which keeps no backups. This dumps it with the
# Supabase CLI (scripts/db-backup.sh), encrypts the bundle to the public key in
# scripts/backup/age-recipient.txt, uploads it as an artifact, and THEN restores
# the plaintext into a throwaway `supabase start` on the runner
# (scripts/db-restore-drill.sh). Upload comes first on purpose: a drill can
# fail for reasons that are not the backup's (the CLI's local auth schema
# lagging production's, production lagging main's migrations), and that must
# turn the run red without costing the night's only backup.
#
# The repo is public: artifacts are downloadable by any logged-in GitHub user
# (hence the encryption) and logs are readable by everyone (hence no URLs, no
# per-table counts). SUPABASE_DB_URL is the session-pooler URL (README,
# "Backups"); it is absent on forks, so the job skips rather than fails there.
name: Backup

on:
  schedule:
    - cron: '30 4 * * *'   # after the 03:30 UTC provider sync, before CI's 10:00 nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      # A job-level `if:` cannot read secrets, so gate in a step.
      - id: gate
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL secret not set — backup skipped."
            echo run=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub masks the whole secret; mask the password on its own too,
          # in case a CLI error reformats the URL.
          pw=${SUPABASE_DB_URL#*://*:}; pw=${pw%%@*}
          [ -n "$pw" ] && echo "::add-mask::$pw"
          echo run=true >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v7      # scripts/db-types.sh --check needs npx
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - name: Install age
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      # `latest`, like ci.yml's full job: the newest CLI ships the newest local
      # auth schema, which is what the restored auth rows must fit into.
      - uses: supabase/setup-cli@v3
        if: steps.gate.outputs.run == 'true'
        with:
          version: latest
      - name: Start a throwaway local stack
        if: steps.gate.outputs.run == 'true'
        run: supabase start

      - name: Dump and encrypt
        if: steps.gate.outputs.run == 'true'
        run: scripts/db-backup.sh backup
      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.run == 'true'
        with:
          name: db-backup-${{ steps.gate.outputs.date }}-${{ github.run_id }}
          path: backup/*.age
          retention-days: 90
          compression-level: 0     # age output is incompressible
          if-no-files-found: error

      - name: Restore drill
        if: steps.gate.outputs.run == 'true'
        run: scripts/db-restore-drill.sh backup
