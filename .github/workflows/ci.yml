name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repo — no job needs write access to contents,
# packages, or PRs. Artifacts upload under this fine.
permissions:
  contents: read

# Supersede in-flight runs when a PR branch is force-pushed; never cancel a
# main-branch run mid-deploy-verification.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Typecheck + unit tests + lint. No browsers, no Docker — fast fail.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm run build = tsc -b (app, node, api, e2e, and evals projects — all
      # strict, all referenced from the root tsconfig.json) + vite build, so
      # the eval harness is typechecked here too and the production bundle is
      # proven buildable on every push.
      - run: npm run build
      - run: npm test
      # oxlint fails on errors only; pre-existing warnings don't block.
      - run: npm run lint
      # Every root-level api/*.ts becomes its own Vercel serverless function.
      # The 12-function cap stopped binding after the Hono consolidation
      # (PR #3), but an accidental root-level file still deploys as a new
      # function — new handlers belong in api/_lib/handlers/. Bump the
      # expected count only for a deliberate new entry point.
      - name: Guard serverless function count
        run: |
          expected=4  # [...path].ts, calendar-feed.ts, chat.ts, review-cron.ts
          actual=$(find api -maxdepth 1 -name '*.ts' | wc -l)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::api/ has $actual root-level .ts files (expected $expected)." \
              "New handlers belong in api/_lib/handlers/ behind the router;" \
              "if a new standalone function is deliberate, bump 'expected' here."
            find api -maxdepth 1 -name '*.ts'
            exit 1
          fi

      # Production dependencies must be free of high/critical advisories.
      # Dev-only advisories don't block (they sit behind @vercel/node's dev
      # shim and the like) — dependabot PRs handle those as fixes land.
      - run: npm audit --omit=dev --audit-level=high

  # Playwright mock project: full UI flows with all writes stubbed.
  e2e-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=mock
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mock-traces
          path: test-results/
          retention-days: 7

  # Local Supabase stack: handler integration tests (real JWTs, RLS,
  # cross-user isolation) + live e2e through the vite API plugin.
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - run: ./scripts/db-reset-local.sh
      # The committed Supabase types must match a schema built from scratch by
      # every migration in the repo — the only place that database exists.
      - run: scripts/db-types.sh --check
      - run: APEX_LOCAL_SUPABASE=1 npx vitest run api/__tests__/integration
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: APEX_LOCAL_SUPABASE=1 npx playwright test --project=live
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-traces
          path: test-results/
          retention-days: 7
