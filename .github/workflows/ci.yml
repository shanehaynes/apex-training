name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests each queued PR on a temporary branch
  # (gh-readonly-queue/main/…) holding the latest main plus that PR, and it
  # only sees the required checks if the workflow listens for this event —
  # pull_request and push never fire for queue branches. Without it every
  # queued PR times out waiting for checks that never start.
  merge_group:
    branches: [main]
  # Nightly supervisor run: prove main is still green from scratch — the full
  # job rebuilds the database from every migration, so this also catches
  # anything that only breaks on a clean build. The evals job runs only here
  # (and on manual dispatch), not per-PR: it spends real API tokens.
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

# The workflow only reads the repo — no job needs write access to contents,
# packages, or PRs. Artifacts upload under this fine.
permissions:
  contents: read

# Supersede in-flight runs when a PR branch is force-pushed; never cancel a
# main-branch run mid-deploy-verification.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Typecheck + unit tests + lint. No browsers, no Docker — fast fail.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # npm run build = tsc -b (app, node, api, e2e, and evals projects — all
      # strict, all referenced from the root tsconfig.json) + vite build, so
      # the eval harness is typechecked here too and the production bundle is
      # proven buildable on every push.
      - run: npm run build
      - run: npm test
      # oxlint fails on errors only; pre-existing warnings don't block.
      - run: npm run lint
      # Serverless function count + npm audit, in a script agent:check also
      # runs — the guards live in one place so a branch cannot pass its local
      # gate and still go red here.
      - run: npm run ci:guards

  # Playwright mock project: full UI flows with all writes stubbed.
  e2e-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=mock
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mock-traces
          path: test-results/
          retention-days: 7

  # Local Supabase stack: handler integration tests (real JWTs, RLS,
  # cross-user isolation) + live e2e through the vite API plugin.
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase start
      - run: ./scripts/db-reset-local.sh
      # The committed Supabase types must match a schema built from scratch by
      # every migration in the repo — the only place that database exists.
      - run: scripts/db-types.sh --check
      - run: APEX_LOCAL_SUPABASE=1 npx vitest run api/__tests__/integration
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: APEX_LOCAL_SUPABASE=1 npx playwright test --project=live
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-traces
          path: test-results/
          retention-days: 7

  # The iOS core package on Linux. This is the gate that keeps ApexCore free of
  # Apple-only imports and dependencies (docs/ios/architecture.md rule 2) — the
  # import grep in ci:guards catches the common case, but only a real Linux build
  # proves it. Fast: no dependencies to resolve, no SDK.
  apexcore-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift test --package-path ios/Packages/ApexCore

  # The iOS app: generate the project, build it, run the unit and UI tests on a
  # simulator.
  #
  # macos-26 rather than macos-15: ApexKit's manifest is swift-tools-version 6.2
  # and the sources are Swift 6.3, which an older runner's Xcode cannot build.
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # An `on.paths` filter would be the obvious way to skip web-only PRs, but
      # path filters and required checks do not compose: a required check that
      # never starts blocks the merge queue forever. The job always runs and
      # finishes in seconds when no iOS file changed.
      #
      # Only PRs skip. On push/schedule/dispatch the merge base *is* HEAD, so the
      # diff is empty and this would skip every time — the nightly run would then
      # never build the app at all, which is the one run that most needs to.
      - name: Skip when a pull request changes no iOS paths
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          base=$(git merge-base origin/main HEAD)
          if git diff --quiet "$base" HEAD -- ios/ ; then
            echo "no ios/ changes"
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - run: brew install xcodegen
        if: env.skip != '1'
      # The SwiftPM graph, cached. supabase-swift and GRDB are clones from
      # github.com, and swift-syntax (pulled in by snapshot-testing and by
      # supabase's macros) is the expensive one: an unreachable host, or a
      # tag deleted upstream, fails this job for reasons that have nothing to
      # do with the commit. ~/Library/Caches/org.swift.swiftpm is SwiftPM's
      # shared clone cache and SourcePackages is the checkout xcodebuild
      # resolves into, under the -derivedDataPath below.
      #
      # Keyed on what decides the graph: the committed resolution when there
      # is one (ios/Package.resolved, hashFiles simply ignores a path that
      # does not exist) and the two manifests that pin the direct versions.
      # The prefix restore-key means a manifest edit warms from the last
      # build rather than starting from nothing.
      #
      # Restore here, save at the end and only on main, because the entry is
      # 803 MB (measured) and a cache saved on a branch is visible only to that
      # branch — thirty open iOS branches would each write their own copy into
      # a 10 GB repo budget and evict each other, and everyone else, for no
      # hit. Saved from main it is one entry that every PR restores from.
      - uses: actions/cache/restore@v6
        id: swiftpm
        if: env.skip != '1'
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/build/dd/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/Package.resolved', 'ios/Packages/ApexKit/Package.swift', 'ios/project.yml') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-
      - run: xcodegen generate --spec ios/project.yml
        if: env.skip != '1'
      # CODE_SIGNING_ALLOWED=NO: a simulator build needs no identity, and the
      # runner has none. Local is the only configuration whose Supabase values
      # are committed, so it is the only one CI can build.
      #
      # OS=26.5 rather than "whatever iPhone 17 the image has": a destination
      # with no OS matches every runtime that carries the device, and xcodebuild
      # then picks the first and says so in a warning nobody reads — the runs
      # this job has made so far matched two (arm64 and x86_64 of the same
      # 26.5 device). A runner image that adds a second runtime would silently
      # change what the tests ran on. Pinned, an image that drops 26.5 fails
      # here with "Unable to find a device matching the provided destination
      # specifier" instead, which is a bump to make deliberately. The runtime
      # the image ships is in any ios job log, on the line xcodebuild prints
      # for the destination it chose; `xcrun simctl list runtimes` on a runner
      # is the other way.
      #
      # -retry-tests-on-failure -test-iterations 2: a failed test is run once
      # more and the suite passes if the second run does. The point is not the
      # extra chance — the tests already had one, inside themselves, where
      # nobody could see it (#192, #195: a starved runner drops a synthesized
      # tap, so the helpers re-sent taps and a run that flaked still reported a
      # clean pass). The retry belongs here because xcodebuild records it: the
      # .xcresult marks the test "passed on retry", and that is the only place
      # the real flake rate is visible.
      - name: Build and test
        if: env.skip != '1'
        run: |
          xcodebuild \
            -project ios/Apex.xcodeproj \
            -scheme Apex \
            -configuration Local \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -derivedDataPath ios/build/dd \
            -resultBundlePath ios/build/Apex.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            test
      # Only from main (see the restore step), and only when the exact key was
      # not already there: a prefix restore is a warm start, not a reason to
      # write 803 MB back.
      - uses: actions/cache/save@v6
        if: env.skip != '1' && github.ref == 'refs/heads/main' && steps.swiftpm.outputs.cache-hit != 'true'
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/build/dd/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/Package.resolved', 'ios/Packages/ApexKit/Package.swift', 'ios/project.yml') }}

      # The UI smoke signs in against a Supabase stack the runner does not have,
      # so it skips itself there; the .xcresult is what a Linux session reads
      # with `gh run download` when it needs to see what happened.
      - uses: actions/upload-artifact@v7
        if: always() && env.skip != '1'
        with:
          name: ios-results
          path: ios/build/Apex.xcresult
          retention-days: 7

  # Coach eval suite (deterministic checkers + LLM judge). Nightly/manual
  # only — it calls the Anthropic API, so per-PR runs would spend tokens on
  # every push. Needs the ANTHROPIC_API_KEY repo secret; without it the job
  # reports itself skipped rather than failing, so the schedule stays green
  # until the secret is configured.
  evals:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run coach evals
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not set — evals skipped."
            exit 0
          fi
          npm run eval
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: evals/results/
          retention-days: 30
          if-no-files-found: ignore
