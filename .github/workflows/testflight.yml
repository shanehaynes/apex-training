# A TestFlight build with no local steps: archive, export and upload through
# ios/fastlane/Fastfile's `beta` lane. Manual only — every run publishes a
# build to Apple, so nothing here fires on push.
#
#   gh workflow run testflight.yml                       # main
#   gh workflow run testflight.yml --ref <branch>        # a branch
#   gh workflow run testflight.yml -f changelog="…"      # a What to Test note
#
# SECRETS (Settings → Secrets and variables → Actions), all from the App
# Store Connect API key testflight.sh already uses:
#   ASC_KEY_ID          the key id (the XXXXXXXXXX in AuthKey_XXXXXXXXXX.p8)
#   ASC_ISSUER_ID       the issuer id (App Store Connect → Users and Access →
#                       Integrations → App Store Connect API)
#   ASC_KEY_P8_BASE64   the .p8, base64-encoded on one line:
#                       base64 -i ~/.appstoreconnect/private_keys/AuthKey_<KEY_ID>.p8 | tr -d '\n'
# Without them the job stops at "Check secrets" and names what is missing.
#
# One optional secret:
#   SUPABASE_ANON_KEY   the production anon key the Release build bakes in. It
#                       is public by construction (the web ships it in every
#                       page), and ios/scripts/secrets.sh can scrape it back out
#                       of the deployed bundle — which is the fallback when this
#                       is unset. Set it so a release does not depend on the web
#                       deploy being up: Supabase → Project Settings → API.
#
# The build number is `git rev-list --count HEAD` (fetch-depth 0 below is
# what makes that count the real one), the same rule as testflight.sh — see
# docs/ios/decisions.md D-034 for why not github.run_number.
#
# Builds expire 90 days after upload (docs/ios/MASTER.md, "Release cadence").
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "What to Test (optional; shown to testers)"
        required: false
        default: ""

permissions:
  contents: read

# Two uploads of the same commit would collide on the build number; two of
# different commits would race for the same app record. One at a time, and
# never cancel a run that may already be uploading.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  beta:
    # macos-26 rather than macos-15, for the same reason as ci.yml's ios job:
    # ApexKit's manifest is swift-tools-version 6.2 and the sources are Swift
    # 6.3, which an older runner's Xcode cannot build.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APEX_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      APEX_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # fastlane insists on a UTF-8 locale.
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - name: Check secrets
        env:
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=()
          [ -n "$APEX_ASC_KEY_ID" ]    || missing+=(ASC_KEY_ID)
          [ -n "$APEX_ASC_ISSUER_ID" ] || missing+=(ASC_ISSUER_ID)
          [ -n "$P8" ]                 || missing+=(ASC_KEY_P8_BASE64)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing repository secret(s): ${missing[*]} — see the header of .github/workflows/testflight.yml"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # The build number is the commit count; a shallow clone would stamp 1.
          fetch-depth: 0

      # The same pin as ci.yml's ios job, and for a stronger reason: the image
      # carries seven Xcodes and rotates the default, so without this the
      # compiler, SDK and signing behaviour behind a signed production archive
      # could change between two runs of the same commit. Bump ios/.xcode-version
      # in a PR — CI's ios job builds with it before any release does.
      - name: Select the pinned Xcode
        run: |
          version=$(tr -d '[:space:]' < ios/.xcode-version)
          app="/Applications/Xcode_${version}.app"
          if [ ! -d "$app" ]; then
            echo "::error::Xcode $version (ios/.xcode-version) is not on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version

      - name: Install the App Store Connect API key
        env:
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          key=~/.appstoreconnect/private_keys/AuthKey_${APEX_ASC_KEY_ID}.p8
          printf '%s' "$P8" | base64 --decode > "$key"
          chmod 600 "$key"
          grep -q 'BEGIN PRIVATE KEY' "$key" || { echo "::error::ASC_KEY_P8_BASE64 did not decode to a .p8"; exit 1; }

      - run: brew install xcodegen

      # fastlane from ios/Gemfile rather than whatever the image ships, and
      # `bundle exec` below so the lane can only ever run that version. With
      # ios/Gemfile.lock committed, bundler runs in deployment mode and refuses a
      # Gemfile the lock does not match; until it is (it can only be generated
      # where bundler runs — see ios/Gemfile), this resolves fastlane's own
      # dependencies fresh and caches the result.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true
          working-directory: ios

      # The production anon key the Release build bakes in. Public by
      # construction — the web ships it in every page load — but the release
      # should not depend on the web deploy being up, or on a scrape finding the
      # right JWT in a minified bundle, so the repo secret is the source and the
      # scrape is the fallback. Either way ios/scripts/secrets.sh --check has the
      # last word: it asserts the key is this project's unexpired anon key.
      - name: Write ios/Config/Secrets.xcconfig
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            mkdir -p ios/Config
            {
              printf '%s\n' '// Written by .github/workflows/testflight.yml from the SUPABASE_ANON_KEY repo secret.'
              printf 'SUPABASE_ANON_KEY = %s\n' "$SUPABASE_ANON_KEY"
            } > ios/Config/Secrets.xcconfig
            echo "wrote ios/Config/Secrets.xcconfig from the SUPABASE_ANON_KEY secret"
          else
            echo "::notice::no SUPABASE_ANON_KEY secret — scraping the deployed bundle instead"
            ios/scripts/secrets.sh
          fi
          ios/scripts/secrets.sh --check

      - run: xcodegen generate --spec ios/project.yml

      # The committed transitive resolution, in place before gym lets xcodebuild
      # resolve the package graph. The beta lane calls this too, for a Mac run
      # that never goes through this workflow; both are no-ops while
      # ios/Package.resolved is absent.
      - run: ios/scripts/sync-package-resolved.sh

      - name: Archive, export, upload
        working-directory: ios
        run: bundle exec fastlane beta changelog:"${{ github.event.inputs.changelog }}"

      # The .ipa that was uploaded, for the record; the archive's dSYMs went up
      # with it (uploadSymbols).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testflight-ipa
          path: ios/build/export-*/*.ipa
          retention-days: 14
          if-no-files-found: ignore
