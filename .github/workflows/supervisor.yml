# The supervisor sweep, after every nightly instead of on somebody remembering.
#
# scripts/supervisor-report.sh is the detector for everything that rots
# between sessions — main's CI, production's auth configuration, production's
# database schema, the nightly backup, where every open PR sits. It was only
# ever run by hand. Four consecutive red nightly backups went unnoticed while
# it existed: GitHub's own failure emails had already fired and had already
# been filtered away, so another email was never going to be the answer. An
# issue is: it has one URL, it stays open until the thing is fixed, and it is
# the same place the rest of this repo's work lives.
#
# --no-local drops the sections about Shane's machine (the shared Supabase
# stack, the primary checkout, git-tidy, worktree age, session claims), which
# a runner cannot see and must not report an all-clear about. See the README's
# "Operations" section for which half is covered where. Everything about
# PRODUCTION and the REPOSITORY runs here:
#
#   covered nightly here        only on Shane's box (run the sweep by hand)
#   ────────────────────        ──────────────────────────────────────────
#   main's latest CI run        the shared local Supabase stack's schema
#   ios, evals jobs vs caps     the primary checkout: on main, and clean
#   coach model catalog         git-tidy's dry run (merged branches)
#   production auth config      worktree age
#   production DB schema        session claims (.claude/state/claims.tsv)
#   the nightly backup
#   open PRs + combine check
#
# Its own workflow, not a job in ci.yml, for the reason model-catalog.yml
# gives: the sweep asks `gh run list --workflow CI --branch main` whether main
# is green, so a sweep job inside CI would answer its own question, and an
# unapplied production migration would read as "main is broken" — which it is
# not. Drift in the world is not a regression in the code.
#
# The script always exits 0 (it is a report), so turning its output into a
# signal is this workflow's job: any ACTION line fails the run and lands in a
# single fixed-title issue, updated rather than duplicated.
name: Supervisor

on:
  # When CI's nightly finishes, so the sweep reports that night's run. It used
  # to run at 11:00 UTC, an hour after the nightly's cron, but GitHub starts
  # both hours late (the nightly between 13:19 and 19:51 UTC, 2026-10-10 to
  # 11-08), and the sweep landed within minutes of the nightly's end, on
  # either side. Landing before it, the sweep read an older run, and a push
  # run that finished before the next day's sweep hid the nightly for good: a
  # red in evals or prod-checks, which run only at night, went unreported.
  #
  # workflow_run cannot filter on the triggering run's event, so every CI run
  # on main starts a run here, and the jobs below run only for the nightly's.
  # Main's CI runs one run at a time (ci.yml's concurrency), so when the
  # nightly finishes, any newer run on main is still waiting or running, or
  # was cancelled before it ran (which the `── main` block passes over): the
  # block's verdict is the nightly's.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # The fallback, for a day without a nightly: GitHub drops scheduled runs
  # under load. The `nightly` job lets it sweep only then. At 23:00 UTC,
  # with the delays above on both crons, today's nightly is 3 to 20 hours old
  # and yesterday's at least 27.
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

# contents: read for the checkout; issues: write to open, update and close the
# one report issue. Nothing here writes to the repository or to production.
permissions:
  contents: read
  issues: write

# One sweep at a time, so two never write the report issue at once. A group
# holds one waiting run, and a newer one cancels it, so each run that sweeps
# nothing (every other CI run on main starts one) gets a group of its own:
# in the shared group, one could cancel a nightly's sweep while it waited.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event != 'schedule' && format('supervisor-{0}', github.run_id) || 'supervisor' }}
  cancel-in-progress: false

jobs:
  # Whether CI's nightly ran. After the nightly: whether it started any job.
  # On the fallback cron: whether a nightly started in the last 24 hours; if
  # one did, the sweep that followed it stands. A second sweep would read
  # main's newest run instead, and a green push run there hides a red nightly.
  # A re-run of the nightly is a second sweep of that kind, so it sweeps
  # nothing either: its result is on the run itself.
  nightly:
    if: github.event_name == 'schedule' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Both empty on the fallback cron.
      NIGHTLY_RUN_ID: ${{ github.event.workflow_run.id }}
      NIGHTLY_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    outputs:
      sweep: ${{ steps.check.outputs.sweep }}
      action: ${{ steps.check.outputs.action }}
    steps:
      # Tested by scripts/__tests__/supervisor-nightly.test.ts, which runs the
      # lines between the markers.
      - id: check
        run: |
          # nightly-check:begin
          if [ -n "${NIGHTLY_RUN_ID:-}" ] && [ "${NIGHTLY_ATTEMPT:-1}" != 1 ]; then
            echo "CI run $NIGHTLY_RUN_ID is a re-run (attempt $NIGHTLY_ATTEMPT); the sweep after its first attempt stands."
            echo "sweep=false" >> "$GITHUB_OUTPUT"
          elif [ -n "${NIGHTLY_RUN_ID:-}" ]; then
            # A nightly that waited its turn in main's queue is cancelled
            # before any job starts when a newer push takes its place. Then
            # evals and prod-checks did not run, and the `── main` block,
            # which passes such a run over, cannot say so.
            if ran=$(gh run view "$NIGHTLY_RUN_ID" --json jobs,conclusion --jq '"\(.jobs | length) \(.conclusion)"'); then
              case "$ran" in
                "0 "*)
                  echo "action=ACTION CI's nightly ran no job (run $NIGHTLY_RUN_ID, ${ran#0 }), so evals and prod-checks did not run tonight — a push that takes its place in main's queue cancels it this way" >> "$GITHUB_OUTPUT" ;;
              esac
            else
              echo "::warning::Could not read the jobs of CI run $NIGHTLY_RUN_ID; sweeping without knowing whether the nightly ran."
            fi
            echo "sweep=true" >> "$GITHUB_OUTPUT"
          elif newest=$(gh run list --workflow CI --branch main --event schedule --limit 1 --json createdAt \
              --jq 'if length == 0 then "none" elif now - (.[0].createdAt | fromdateiso8601) < 86400 then "recent \(.[0].createdAt)" else "stale \(.[0].createdAt)" end'); then
            case "$newest" in
              recent*)
                echo "CI's nightly started at ${newest#recent }; the sweep after it stands."
                echo "sweep=false" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "action=ACTION CI's nightly has not run in 24 hours (newest: ${newest#stale }), and with it evals and prod-checks — GitHub drops scheduled runs under load, and disables them in a public repository after 60 days without activity: gh run list --workflow CI --event schedule" >> "$GITHUB_OUTPUT"
                echo "sweep=true" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "::warning::Could not list CI's scheduled runs; sweeping without knowing whether the nightly ran."
            echo "sweep=true" >> "$GITHUB_OUTPUT"
          fi
          # nightly-check:end

  sweep:
    needs: nightly
    # After the nightly, on a dispatch, or on the fallback cron when `nightly`
    # found no nightly. A `nightly` job that failed has no answer, so the
    # sweep runs rather than skip a day silently.
    if: >-
      !cancelled() && needs.nightly.outputs.sweep != 'false' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # gh, for the sweep's own `gh run list` / `gh pr list` calls and for the
      # issue steps below.
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: 'Supervisor sweep: attention needed'
    steps:
      # Full history: the sweep's combine check runs `git merge-tree` across
      # every open PR branch, and prod-schema-check.mjs reads
      # database.types.ts out of origin/main rather than the working tree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No `npm ci`: the scripts the sweep runs import node: builtins only.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Sweep
        env:
          # The production schema check. Both must be set together or it
          # reports itself skipped (and the step below warns rather than
          # passing quietly).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # The `nightly` job's finding, if any: about whether the nightly ran,
          # which the script cannot see.
          NIGHTLY_ACTION: ${{ needs.nightly.outputs.action }}
        run: |
          # The script is built never to fail, so its OUTPUT is the signal —
          # but capture the status anyway, because a script that dies at the
          # assignment under the default shell's -e would leave a red run with
          # an empty log.
          out=$(scripts/supervisor-report.sh --no-local 2>&1) && rc=0 || rc=$?
          [ -z "$NIGHTLY_ACTION" ] || out=$(printf '%s\n%s' "$NIGHTLY_ACTION" "$out")
          printf '%s\n' "$out"
          printf '%s\n' "$out" > sweep.txt

          if [ "$rc" -ne 0 ]; then
            echo "::error::scripts/supervisor-report.sh exited $rc without finishing — nothing was swept."
            exit 1
          fi

          grep '^ACTION' sweep.txt > actions.txt || true
          # A sweep that could not look at production is not a clean sweep.
          if grep -q 'skipped' sweep.txt; then
            grep 'skipped' sweep.txt | sed 's/^ *//; s/^/::warning::/'
          fi

      # Split from the sweep so the issue is filed even when a later step
      # would have failed, and so the sweep step's own log stays readable.
      - name: File or update the report issue
        run: |
          set -euo pipefail

          # One issue, for the life of the repository: found by exact title in
          # any state, reopened if it was closed. A new issue per night would
          # be the same email problem wearing a different hat.
          existing=$(gh issue list --state all --limit 100 --json number,title,state \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | \"\(.number) \(.state)\"" | head -1 || true)
          number=${existing%% *}
          state=${existing#* }
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ ! -s actions.txt ]; then
            echo "No ACTION lines — the sweep is clean."
            if [ -n "$number" ] && [ "$state" = OPEN ]; then
              gh issue comment "$number" --body "Clean sweep on $(date -u +%Y-%m-%d) — closing. [Run]($run_url)"
              gh issue close "$number"
            fi
            exit 0
          fi

          # The body carries the ACTION lines only, not the whole report: this
          # repository is public, and the full sweep prints hosts, branch names
          # and PR titles that have no reason to be mirrored into an issue.
          # The run log has everything.
          {
            echo "The nightly sweep found things that need a human. Updated in place each night; closed automatically on the first clean sweep."
            echo
            echo "**$(date -u '+%Y-%m-%d %H:%M') UTC** — [full report]($run_url)"
            echo
            sed 's/^ACTION /- /' actions.txt
            echo
            echo "Run it yourself with \`scripts/supervisor-report.sh\` (no \`--no-local\`, which adds the sections about your own machine)."
          } > body.md

          # The body is rewritten every night (nobody is notified for an edit),
          # and a comment — which does notify — is posted only when the issue
          # goes from closed to open again. A nightly comment on a standing
          # issue is the email problem all over again.
          if [ -n "$number" ]; then
            if [ "$state" = CLOSED ]; then
              gh issue reopen "$number"
              gh issue comment "$number" --body-file body.md
            fi
            gh issue edit "$number" --body-file body.md
            echo "Updated #$number"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

      - name: Fail on any ACTION line
        run: |
          if [ -s actions.txt ]; then
            sed 's/^ACTION /::error::ACTION /' actions.txt
            exit 1
          fi
